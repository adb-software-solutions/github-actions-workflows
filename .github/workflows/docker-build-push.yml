name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      application:
        type: string
        required: true
      images:
        description: JSON array of image suffixes, for example ["backend","celery-worker"]
        type: string
        required: true
      context:
        type: string
        default: .
      registry:
        type: string
        default: registry.digitalocean.com/adbsoftwaresolutions
      infisical-identity-id:
        type: string
        required: true
      infisical-registry-project-id:
        type: string
        required: true
      infisical-application-project-id:
        type: string
        default: ""
      build-arg-keys:
        description: JSON array of required non-sensitive application values to pass as Docker build args.
        type: string
        default: "[]"
      optional-build-arg-keys:
        description: JSON array of optional non-sensitive application values to pass as Docker build args when present and non-empty.
        type: string
        default: "[]"
      build-env-file:
        description: Optional path to a dotenv file for non-sensitive build-time configuration.
        type: string
        default: ""
      build-env-keys:
        description: JSON array of required non-sensitive application values written to build-env-file.
        type: string
        default: "[]"
      optional-build-env-keys:
        description: JSON array of optional non-sensitive application values written to build-env-file when present and non-empty.
        type: string
        default: "[]"
      infisical-api-url:
        type: string
        default: https://secrets.adbsoftwaresolutions.co.uk

permissions:
  contents: read
  id-token: write

jobs:
  build-push-scan:
    name: Build, Push and Scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Infisical CLI
        run: npm install --global @infisical/cli

      - name: Authenticate to Infisical
        shell: bash
        env:
          INFISICAL_API_URL: ${{ inputs.infisical-api-url }}
        run: |
          set -euo pipefail
          oidc_token="$(curl -fsS -G \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=https://github.com/adb-software-solutions" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')"
          access_token="$(curl -fsS -X POST \
            "${INFISICAL_API_URL}/api/v1/auth/oidc-auth/login" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "identityId=${{ inputs.infisical-identity-id }}" \
            --data-urlencode "jwt=${oidc_token}" | jq -r '.accessToken')"
          test -n "${access_token}" && test "${access_token}" != "null"
          echo "::add-mask::${access_token}"
          {
            echo "INFISICAL_API_URL=${INFISICAL_API_URL}"
            echo "INFISICAL_TOKEN=${access_token}"
            echo "INFISICAL_DISABLE_UPDATE_CHECK=true"
          } >> "$GITHUB_ENV"

      - name: Build, push and scan
        uses: adb-software-solutions/github-actions-workflows/.github/actions/docker-build-push@v1
        with:
          application: ${{ inputs.application }}
          image: ${{ matrix.image }}
          context: ${{ inputs.context }}
          registry: ${{ inputs.registry }}
          tag: ${{ github.sha }}
          infisical-registry-project-id: ${{ inputs.infisical-registry-project-id }}
          infisical-application-project-id: ${{ inputs.infisical-application-project-id }}
          build-arg-keys: ${{ inputs.build-arg-keys }}
          optional-build-arg-keys: ${{ inputs.optional-build-arg-keys }}
          build-env-file: ${{ inputs.build-env-file }}
          build-env-keys: ${{ inputs.build-env-keys }}
          optional-build-env-keys: ${{ inputs.optional-build-env-keys }}
