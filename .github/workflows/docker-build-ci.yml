name: Reusable Docker Build CI

# Builds the same images as docker-build-push.yml without logging in to the
# registry or pushing anything, so pull requests prove their Dockerfiles
# still build before they reach main.
#
# The -ci.yml name matters: adb-iac binds each application's pull-request
# Infisical identity to job_workflow_ref .../workflows/*-ci.yml.

on:
  workflow_call:
    inputs:
      application:
        type: string
        required: true
      images:
        description: JSON array of image suffixes, for example ["backend","celery-worker"]
        type: string
        required: true
      context:
        type: string
        default: .
      infisical-identity-id:
        description: Optional. Only needed when build values are read from Infisical.
        type: string
        default: ""
      infisical-application-project-id:
        type: string
        default: ""
      infisical-environment:
        description: Environment the build values are read from (pull requests normally use the CI project's dev).
        type: string
        default: dev
      build-arg-keys:
        description: JSON array of required non-sensitive application values to pass as Docker build args.
        type: string
        default: "[]"
      optional-build-arg-keys:
        description: JSON array of optional non-sensitive application values to pass as Docker build args when present and non-empty.
        type: string
        default: "[]"
      build-env-file:
        description: Optional path to a dotenv file for non-sensitive build-time configuration.
        type: string
        default: ""
      build-env-keys:
        description: JSON array of required non-sensitive application values written to build-env-file.
        type: string
        default: "[]"
      optional-build-env-keys:
        description: JSON array of optional non-sensitive application values written to build-env-file when present and non-empty.
        type: string
        default: "[]"
      infisical-api-url:
        type: string
        default: https://secrets.adbsoftwaresolutions.co.uk

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    env:
      # Fork pull requests never authenticate (see README, OIDC and Infisical).
      USE_INFISICAL: ${{ inputs.infisical-identity-id != '' && inputs.infisical-application-project-id != '' && !github.event.pull_request.head.repo.fork }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Infisical CLI
        if: env.USE_INFISICAL == 'true'
        run: npm install --global @infisical/cli

      - name: Authenticate to Infisical
        if: env.USE_INFISICAL == 'true'
        shell: bash
        env:
          INFISICAL_API_URL: ${{ inputs.infisical-api-url }}
        run: |
          set -euo pipefail
          oidc_token="$(curl -fsS -G \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=https://github.com/adb-software-solutions" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')"
          access_token="$(curl -fsS -X POST \
            "${INFISICAL_API_URL}/api/v1/auth/oidc-auth/login" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "identityId=${{ inputs.infisical-identity-id }}" \
            --data-urlencode "jwt=${oidc_token}" | jq -r '.accessToken')"
          test -n "${access_token}" && test "${access_token}" != "null"
          echo "::add-mask::${access_token}"
          {
            echo "INFISICAL_API_URL=${INFISICAL_API_URL}"
            echo "INFISICAL_TOKEN=${access_token}"
            echo "INFISICAL_DISABLE_UPDATE_CHECK=true"
          } >> "$GITHUB_ENV"

      - name: Prepare application build values
        id: build-values
        if: env.USE_INFISICAL == 'true'
        shell: bash
        env:
          PROJECT_ID: ${{ inputs.infisical-application-project-id }}
          INFISICAL_ENVIRONMENT: ${{ inputs.infisical-environment }}
          BUILD_ARG_KEYS: ${{ inputs.build-arg-keys }}
          OPTIONAL_BUILD_ARG_KEYS: ${{ inputs.optional-build-arg-keys }}
          BUILD_ENV_KEYS: ${{ inputs.build-env-keys }}
          OPTIONAL_BUILD_ENV_KEYS: ${{ inputs.optional-build-env-keys }}
          BUILD_ENV_FILE: ${{ inputs.build-env-file }}
        run: |
          set -euo pipefail
          args_file="${RUNNER_TEMP}/docker-build-args-${{ matrix.image }}"
          : > "${args_file}"

          # get KEY: the value, or nothing. Required keys must be non-empty.
          get() {
            infisical secrets get "$1" --projectId="${PROJECT_ID}" \
              --env="${INFISICAL_ENVIRONMENT}" --path=/ --plain --silent
          }

          while IFS= read -r key; do
            [[ -z "${key}" ]] && continue
            value="$(get "${key}")"
            test -n "${value}"
            echo "::add-mask::${value}"
            printf '%s\0%s\0' "--build-arg" "${key}=${value}" >> "${args_file}"
          done < <(jq -r '.[]' <<< "${BUILD_ARG_KEYS}")

          while IFS= read -r key; do
            [[ -z "${key}" ]] && continue
            if value="$(get "${key}" 2>/dev/null)" && [[ -n "${value}" ]]; then
              echo "::add-mask::${value}"
              printf '%s\0%s\0' "--build-arg" "${key}=${value}" >> "${args_file}"
            fi
          done < <(jq -r '.[]' <<< "${OPTIONAL_BUILD_ARG_KEYS}")

          if [[ -n "${BUILD_ENV_FILE}" ]]; then
            mkdir -p "$(dirname "${BUILD_ENV_FILE}")"
            umask 077
            : > "${BUILD_ENV_FILE}"
            while IFS= read -r key; do
              [[ -z "${key}" ]] && continue
              value="$(get "${key}")"
              test -n "${value}"
              echo "::add-mask::${value}"
              printf '%s=%s\n' "${key}" "${value}" >> "${BUILD_ENV_FILE}"
            done < <(jq -r '.[]' <<< "${BUILD_ENV_KEYS}")

            while IFS= read -r key; do
              [[ -z "${key}" ]] && continue
              if value="$(get "${key}" 2>/dev/null)" && [[ -n "${value}" ]]; then
                echo "::add-mask::${value}"
                printf '%s=%s\n' "${key}" "${value}" >> "${BUILD_ENV_FILE}"
              fi
            done < <(jq -r '.[]' <<< "${OPTIONAL_BUILD_ENV_KEYS}")
          fi

          echo "args-file=${args_file}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail
          build_args=()
          args_file="${{ steps.build-values.outputs.args-file }}"
          if [[ -n "${args_file}" && -f "${args_file}" ]]; then
            while IFS= read -r -d '' item; do
              build_args+=("${item}")
            done < "${args_file}"
          fi

          docker build \
            -f "Dockerfile.${{ matrix.image }}" \
            -t "${{ inputs.application }}-${{ matrix.image }}:${GITHUB_SHA}" \
            "${build_args[@]}" \
            "${{ inputs.context }}"

          {
            echo "### Docker image built (not pushed)"
            echo
            echo "- Image: \`${{ inputs.application }}-${{ matrix.image }}\`"
            echo "- Dockerfile: \`Dockerfile.${{ matrix.image }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary build environment file
        if: always() && inputs.build-env-file != ''
        run: rm -f "${{ inputs.build-env-file }}"

      - name: Remove temporary build arguments
        if: always()
        run: rm -f "${{ steps.build-values.outputs.args-file }}"
