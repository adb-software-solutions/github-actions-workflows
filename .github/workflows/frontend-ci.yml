name: Reusable Frontend CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      pnpm-version:
        type: string
        default: ""
      working-directory:
        type: string
        default: website
      lockfile:
        type: string
        default: pnpm-lock.yaml
      test-command:
        type: string
        default: "pnpm test --passWithNoTests"
      build-command:
        type: string
        default: "pnpm run build"
      run-tests:
        type: boolean
        default: true
      run-build:
        type: boolean
        default: true
      upload-codecov-bundle:
        type: boolean
        default: false
      infisical-identity-id:
        type: string
        default: ""
      infisical-project-id:
        type: string
        default: ""
      infisical-codecov-project-id:
        type: string
        default: ""
      infisical-environment:
        type: string
        default: dev
      infisical-path:
        type: string
        default: /
      infisical-api-url:
        type: string
        default: https://secrets.adbsoftwaresolutions.co.uk
      # A throwaway MongoDB for tests and builds: a single-node replica set
      # (so transactions work, as Payload CMS needs) on 127.0.0.1 only,
      # without authentication. Its URI is exported as mongo-uri-env and
      # takes precedence over the same key from Infisical.
      mongo:
        type: boolean
        default: false
      mongo-image:
        type: string
        default: "mongo:8.0"
      mongo-database:
        type: string
        default: test
      mongo-uri-env:
        type: string
        default: DATABASE_URI

permissions:
  contents: read
  id-token: write

jobs:
  frontend:
    name: Frontend Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm from project metadata
        if: inputs.pnpm-version == ''
        uses: pnpm/action-setup@v6

      - name: Set up explicit pnpm version
        if: inputs.pnpm-version != ''
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.lockfile }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Start MongoDB
        if: inputs.mongo
        shell: bash
        env:
          MONGO_IMAGE: ${{ inputs.mongo-image }}
          MONGO_DATABASE: ${{ inputs.mongo-database }}
          MONGO_URI_ENV: ${{ inputs.mongo-uri-env }}
        run: |
          set -euo pipefail
          [[ "${MONGO_URI_ENV}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::mongo-uri-env is not a variable name"; exit 1; }
          [[ "${MONGO_DATABASE}" =~ ^[A-Za-z0-9_-]{1,63}$ ]] || { echo "::error::mongo-database is not a database name"; exit 1; }
          # MongoDB 8 exits at start-up on Linux 6.19+ (the runners' kernel since
          # October 2026) because its TCMalloc per-CPU caches clash with glibc's
          # rseq (SERVER-121912). The image sets glibc.pthread.rseq=0 to enable
          # those caches; rseq=1 hands rseq back to glibc and TCMalloc falls
          # back to per-thread caches.
          docker run -d --name ci-mongo -p 127.0.0.1:27017:27017 \
            -e GLIBC_TUNABLES=glibc.pthread.rseq=1 "${MONGO_IMAGE}" \
            --replSet rs0 --bind_ip_all --wiredTigerCacheSizeGB 0.25 >/dev/null
          mongosh() { docker exec ci-mongo mongosh --quiet --norc "$@"; }
          mongo_failed() {
            echo "::error::$1 (kernel $(uname -r), image ${MONGO_IMAGE})"
            docker logs ci-mongo 2>&1 | tail -30
            exit 1
          }
          running() { [[ "$(docker inspect -f '{{.State.Running}}' ci-mongo)" == true ]]; }
          for _ in $(seq 1 60); do
            running || mongo_failed "MongoDB exited during start-up"
            mongosh --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)' >/dev/null 2>&1 && break
            sleep 1
          done
          mongosh --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)' >/dev/null 2>&1 \
            || mongo_failed "MongoDB did not answer within 60 seconds"
          # The member is named localhost:27017, which is the same server
          # from inside the container and from the runner.
          mongosh --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})" >/dev/null
          for _ in $(seq 1 60); do
            mongosh --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1 && break
            sleep 1
          done
          mongosh --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' \
            || mongo_failed "MongoDB did not become primary within 60 seconds"
          uri="mongodb://127.0.0.1:27017/${MONGO_DATABASE}?replicaSet=rs0"
          {
            echo "${MONGO_URI_ENV}=${uri}"
            # Re-applied inside `infisical run`, so it wins over Infisical.
            echo "CI_SERVICE_ENV=${MONGO_URI_ENV}=${uri}"
          } >> "$GITHUB_ENV"
          echo "MongoDB ready: ${MONGO_URI_ENV}=${uri}"

      - name: Determine whether Infisical may be used
        id: infisical-policy
        shell: bash
        run: |
          allowed=true
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_repo="${{ github.repository }}"
            head_repo="${{ github.event.pull_request.head.repo.full_name }}"
            if [[ -n "${head_repo}" && "${head_repo}" != "${base_repo}" ]]; then
              allowed=false
            fi
          fi
          if [[ -z "${{ inputs.infisical-identity-id }}" || -z "${{ inputs.infisical-project-id }}" ]]; then
            allowed=false
          fi
          echo "allowed=${allowed}" >> "$GITHUB_OUTPUT"

      - name: Install Infisical CLI
        if: steps.infisical-policy.outputs.allowed == 'true'
        run: npm install --global @infisical/cli

      - name: Authenticate to Infisical
        id: infisical-auth
        if: steps.infisical-policy.outputs.allowed == 'true'
        shell: bash
        env:
          INFISICAL_API_URL: ${{ inputs.infisical-api-url }}
        run: |
          set -euo pipefail
          oidc_token="$(curl -fsS -G \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=https://github.com/adb-software-solutions" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')"
          access_token="$(curl -fsS -X POST \
            "${INFISICAL_API_URL}/api/v1/auth/oidc-auth/login" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "identityId=${{ inputs.infisical-identity-id }}" \
            --data-urlencode "jwt=${oidc_token}" | jq -r '.accessToken')"
          test -n "${access_token}" && test "${access_token}" != "null"
          echo "::add-mask::${access_token}"
          {
            echo "INFISICAL_API_URL=${INFISICAL_API_URL}"
            echo "INFISICAL_TOKEN=${access_token}"
            echo "INFISICAL_DISABLE_UPDATE_CHECK=true"
          } >> "$GITHUB_ENV"
          echo "authenticated=true" >> "$GITHUB_OUTPUT"

      - name: Run tests with Infisical
        if: inputs.run-tests && steps.infisical-auth.outputs.authenticated == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: >-
          infisical run
          --projectId="${{ inputs.infisical-project-id }}"
          --env="${{ inputs.infisical-environment }}"
          --path="${{ inputs.infisical-path }}"
          -- env ${CI_SERVICE_ENV:+"$CI_SERVICE_ENV"} ${{ inputs.test-command }}

      - name: Run tests without Infisical
        if: inputs.run-tests && steps.infisical-auth.outputs.authenticated != 'true'
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}

      - name: Build with Infisical
        if: inputs.run-build && steps.infisical-auth.outputs.authenticated == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: >-
          infisical run
          --projectId="${{ inputs.infisical-project-id }}"
          --env="${{ inputs.infisical-environment }}"
          --path="${{ inputs.infisical-path }}"
          -- env ${CI_SERVICE_ENV:+"$CI_SERVICE_ENV"} ${{ inputs.build-command }}

      - name: Build without Infisical
        if: inputs.run-build && steps.infisical-auth.outputs.authenticated != 'true'
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Read Codecov token
        id: codecov
        if: inputs.upload-codecov-bundle && steps.infisical-auth.outputs.authenticated == 'true' && inputs.infisical-codecov-project-id != ''
        shell: bash
        run: |
          set -euo pipefail
          token="$(infisical secrets get CODECOV_TOKEN \
            --projectId="${{ inputs.infisical-codecov-project-id }}" \
            --env=dev --path=/ --plain --silent)"
          test -n "${token}"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Upload bundle analysis to Codecov
        if: inputs.upload-codecov-bundle && steps.codecov.outputs.token != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ steps.codecov.outputs.token }}
          plugin: bundler
          flags: website
          name: Website Bundle Analysis
          directory: ./${{ inputs.working-directory }}/.next
          fail_ci_if_error: false
