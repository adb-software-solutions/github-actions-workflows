name: Reusable Application Deploy

on:
  workflow_call:
    inputs:
      application:
        type: string
        required: true
      image-tag:
        type: string
        default: latest
      ansible-extra-vars-json:
        type: string
        default: "{}"
      infisical-identity-id:
        type: string
        required: true
      infisical-application-project-id:
        type: string
        required: true
      infisical-deployment-bootstrap-project-id:
        type: string
        required: true
      infisical-infrastructure-project-id:
        type: string
        required: true
      infisical-registry-project-id:
        description: >-
          Shared container-registry project (adb-container-registry). Its
          credentials log the target in before images are pulled. Deploy-only
          applications have no access to it and deploy public images.
        type: string
        default: 848009f4-aa7d-45e2-8fb6-404bd8f25115
      infisical-api-url:
        type: string
        default: https://secrets.adbsoftwaresolutions.co.uk
      ssh-host:
        type: string
        default: 206.189.28.66
      ssh-port:
        type: number
        default: 1999
      migrate:
        description: >-
          Explicitly move the application from its migration.from_host (a
          legacy host) to its adb-iac host: stops it there, copies its
          databases and media and deploys it on the new host, including DNS.
          Not needed for a first deploy to the new host: adb-deploy migrates
          automatically while the target does not hold the application yet.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.application }}
    runs-on: ubuntu-latest
    concurrency:
      group: adb-deploy-${{ inputs.application }}
      cancel-in-progress: false
    steps:
      - name: Validate deployment request
        shell: bash
        env:
          APPLICATION: ${{ inputs.application }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REPOSITORY}" == "adb-software-solutions/external-app-deployments" ]]; then
            expected_ref="refs/heads/main"
          else
            expected_ref="refs/heads/deploy"
          fi

          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "This reusable deployment workflow may only run from ${expected_ref}." >&2
            exit 1
          fi

          if [[ ! "${APPLICATION}" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Application names must contain only lowercase letters, numbers, and hyphens." >&2
            exit 1
          fi

          if [[ ! "${IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Image tag is not a valid Docker tag." >&2
            exit 1
          fi

      - name: Install Infisical CLI
        run: npm install --global @infisical/cli

      - name: Authenticate to Infisical
        shell: bash
        env:
          INFISICAL_API_URL: ${{ inputs.infisical-api-url }}
        run: |
          set -euo pipefail
          oidc_token="$(curl -fsS -G \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=https://github.com/adb-software-solutions" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')"
          access_token="$(curl -fsS -X POST \
            "${INFISICAL_API_URL}/api/v1/auth/oidc-auth/login" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "identityId=${{ inputs.infisical-identity-id }}" \
            --data-urlencode "jwt=${oidc_token}" | jq -r '.accessToken')"
          test -n "${access_token}" && test "${access_token}" != "null"
          echo "::add-mask::${access_token}"
          {
            echo "INFISICAL_API_URL=${INFISICAL_API_URL}"
            echo "INFISICAL_TOKEN=${access_token}"
            echo "INFISICAL_DISABLE_UPDATE_CHECK=true"
          } >> "$GITHUB_ENV"

      - name: Read deployment bootstrap credentials
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          repo_pat="$(infisical secrets get DEPLOY_REPO_PAT \
            --projectId="${{ inputs.infisical-deployment-bootstrap-project-id }}" \
            --env=prod --path=/github --plain --silent)"
          ssh_key_base64="$(infisical secrets get DEPLOY_SSH_KEY \
            --projectId="${{ inputs.infisical-deployment-bootstrap-project-id }}" \
            --env=prod --path=/ssh --plain --silent | base64 -w 0)"
          test -n "${repo_pat}"
          test -n "${ssh_key_base64}"
          echo "::add-mask::${repo_pat}"
          echo "::add-mask::${ssh_key_base64}"
          {
            echo "repo-pat=${repo_pat}"
            echo "ssh-key-base64=${ssh_key_base64}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout deployment repository
        uses: actions/checkout@v7
        with:
          repository: adb-software-solutions/adb-deploy
          ref: main
          token: ${{ steps.bootstrap.outputs.repo-pat }}
          path: adb-deploy

      # Legacy hosts are listed in adb-deploy's static hosts.ini and keep the
      # original path below. Any other host must be a new-generation (adb-iac)
      # deploy target from the published deploy inventory.
      - name: Resolve deployment target
        id: target
        shell: bash
        env:
          APPLICATION: ${{ inputs.application }}
          EXTRA_VARS_JSON: ${{ inputs.ansible-extra-vars-json }}
          MIGRATE: ${{ inputs.migrate }}
        run: |
          set -euo pipefail
          definition="adb-deploy/vars/applications/${APPLICATION}.yml"
          test -f "${definition}"
          host="$(printf '%s' "${EXTRA_VARS_JSON}" | jq -r '.application_host_override // empty')"
          if [[ -z "${host}" ]]; then
            host="$(yq -r '.application.host' "${definition}")"
          fi
          if [[ ! "${host}" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Application host '${host}' is not a valid inventory name." >&2
            exit 1
          fi
          if grep -Eq "^${host}([[:space:]]|$)" adb-deploy/inventories/production/hosts.ini; then
            generation=legacy
          else
            generation=iac
          fi
          echo "Deploying to ${host} (${generation})."
          {
            echo "host=${host}"
            echo "generation=${generation}"
          } >> "$GITHUB_OUTPUT"

          # adb-deploy migrates automatically when the definition names a
          # migration.from_host and the target does not hold the application
          # yet, so the runner needs the source whenever one is named (and
          # whenever a migration is asked for explicitly).
          source="$(yq -r '.application.migration.from_host // ""' "${definition}")"
          if [[ "${MIGRATE}" == true || -n "${source}" ]]; then
            if [[ "${generation}" != iac || ! "${source}" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "Migration needs an adb-iac target and application.migration.from_host." >&2
              exit 1
            fi
            line="$(grep -E "^${source}[[:space:]]" adb-deploy/inventories/production/hosts.ini || true)"
            address="$(sed -nE 's/.*ansible_host=([0-9.]+).*/\1/p' <<<"${line}")"
            port="$(sed -nE 's/.*ansible_port=([0-9]+).*/\1/p' <<<"${line}")"
            if [[ -z "${address}" ]]; then
              echo "Migration source ${source} is not a legacy host in hosts.ini." >&2
              exit 1
            fi
            echo "Migration source ${source} (${address}:${port:-22})."
            {
              echo "source-address=${address}"
              echo "source-port=${port:-22}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.target.outputs.generation == 'legacy'
        shell: bash
        env:
          DEPLOY_SSH_KEY_BASE64: ${{ steps.bootstrap.outputs.ssh-key-base64 }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s' "${DEPLOY_SSH_KEY_BASE64}" | base64 --decode > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ inputs.ssh-port }}" "${{ inputs.ssh-host }}" >> ~/.ssh/known_hosts

      # The legacy source uses its own key file so it never clashes with the
      # adb-iac pool key (~/.ssh/id_ed25519).
      - name: Configure SSH to the migration source
        if: steps.target.outputs.source-address != ''
        shell: bash
        env:
          DEPLOY_SSH_KEY_BASE64: ${{ steps.bootstrap.outputs.ssh-key-base64 }}
          ADDRESS: ${{ steps.target.outputs.source-address }}
          PORT: ${{ steps.target.outputs.source-port }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          umask 077
          printf '%s' "${DEPLOY_SSH_KEY_BASE64}" | base64 --decode > ~/.ssh/id_legacy
          # Only needed if this deploy migrates; adb-deploy decides that once
          # it has looked at the target, so an unreachable source is not an
          # error here.
          ssh-keyscan -p "${PORT}" "${ADDRESS}" >> ~/.ssh/known_hosts \
            || echo "::warning::Migration source ${ADDRESS}:${PORT} did not answer ssh-keyscan."
          printf 'Host %s\n  IdentityFile ~/.ssh/id_legacy\n  IdentitiesOnly yes\n' "${ADDRESS}" >> ~/.ssh/config

      - name: Load the adb-iac deploy inventory
        id: iac
        if: steps.target.outputs.generation == 'iac'
        shell: bash
        env:
          BOOTSTRAP_PROJECT: ${{ inputs.infisical-deployment-bootstrap-project-id }}
          HOST: ${{ steps.target.outputs.host }}
        run: |
          set -euo pipefail
          read_secret() {
            infisical secrets get "$2" --projectId="${BOOTSTRAP_PROJECT}" \
              --env=prod --path="$1" --plain --silent
          }
          IAC_INVENTORY_ACCESS_KEY_ID="$(read_secret /r2 IAC_INVENTORY_ACCESS_KEY_ID)"
          IAC_INVENTORY_SECRET_ACCESS_KEY="$(read_secret /r2 IAC_INVENTORY_SECRET_ACCESS_KEY)"
          echo "::add-mask::${IAC_INVENTORY_SECRET_ACCESS_KEY}"
          IAC_INVENTORY_ENDPOINT="$(read_secret /r2 IAC_INVENTORY_ENDPOINT)"
          IAC_INVENTORY_BUCKET="$(read_secret /r2 IAC_INVENTORY_BUCKET)"
          export IAC_INVENTORY_ACCESS_KEY_ID IAC_INVENTORY_SECRET_ACCESS_KEY IAC_INVENTORY_ENDPOINT IAC_INVENTORY_BUCKET

          dir="${RUNNER_TEMP}/iac-inventory"
          adb-deploy/scripts/fetch-iac-inventory.sh "${dir}"
          inventory="${dir}/inventory.json"
          if ! jq -e --arg h "${HOST}" '.hosts[$h]' "${inventory}" >/dev/null; then
            reason="$(jq -r --arg h "${HOST}" '.pending[$h] // "not in the adb-iac deploy inventory"' "${inventory}")"
            echo "${HOST} is not deployable: ${reason}" >&2
            exit 1
          fi
          pool="$(jq -r --arg h "${HOST}" '.hosts[$h].pool' "${inventory}")"
          jq -e --arg p "${pool}" '.pools[$p].tailscale_client_id' "${inventory}" >/dev/null
          {
            echo "dir=${dir}"
            echo "pool=${pool}"
            echo "secret=IAC_DEPLOY_SSH_KEY_$(tr 'a-z-' 'A-Z_' <<<"${pool}")"
            jq -r --arg p "${pool}" '.pools[$p] |
              "client-id=\(.tailscale_client_id)", "audience=\(.tailscale_audience)", "tag=\(.runner_tag)"' "${inventory}"
          } >> "$GITHUB_OUTPUT"

      # The pool's trust credential only issues this tag to the callers it is
      # bound to, and the tag only reaches that pool's hosts on SSH.
      - name: Join the tailnet as the pool's deploy runner
        if: steps.target.outputs.generation == 'iac'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ steps.iac.outputs.client-id }}
          audience: ${{ steps.iac.outputs.audience }}
          tags: ${{ steps.iac.outputs.tag }}
          hostname: gha-deploy-${{ inputs.application }}-${{ github.run_id }}-${{ github.run_attempt }}
          # The action always passes --accept-routes; repeating it makes
          # `tailscale up` fail. Routes are turned off in the next step.
          args: --accept-dns=true

      - name: Configure SSH (adb-iac)
        if: steps.target.outputs.generation == 'iac'
        shell: bash
        env:
          BOOTSTRAP_PROJECT: ${{ inputs.infisical-deployment-bootstrap-project-id }}
          SECRET: ${{ steps.iac.outputs.secret }}
        run: |
          set -euo pipefail
          sudo tailscale set --accept-routes=false
          install -d -m 0700 ~/.ssh
          umask 077
          infisical secrets get "${SECRET}" --projectId="${BOOTSTRAP_PROJECT}" \
            --env=prod --path=/ssh --plain --silent > ~/.ssh/id_ed25519
          test -s ~/.ssh/id_ed25519
          # Host keys come only from the published inventory (strict checking).

      - name: Build Ansible variables from Infisical
        id: ansible-vars
        shell: bash
        env:
          APPLICATION: ${{ inputs.application }}
          EXTRA_VARS_JSON: ${{ inputs.ansible-extra-vars-json }}
        run: |
          set -euo pipefail
          app_json="${RUNNER_TEMP}/application-secrets.json"
          extra_json="${RUNNER_TEMP}/deployment-extra-vars.json"
          vars_json="${RUNNER_TEMP}/ansible-extra-vars.json"
          trap 'rm -f "${app_json}" "${extra_json}"' EXIT

          infisical export \
            --projectId="${{ inputs.infisical-application-project-id }}" \
            --env=prod --path=/ --format=json \
            --output-file="${app_json}" >/dev/null

          cloudflare_token="$(infisical secrets get CLOUDFLARE_API_TOKEN \
            --projectId="${{ inputs.infisical-infrastructure-project-id }}" \
            --env=prod --path=/cloudflare --plain --silent)"
          test -n "${cloudflare_token}"
          echo "::add-mask::${cloudflare_token}"

          jq --arg app "${APPLICATION}" '
            if type == "object" then
              with_entries(
                if (.key | type) != "string" then
                  error("Infisical JSON object contains a non-string secret key")
                else
                  .key = ($app + "_" + (.key | ascii_downcase))
                end
              )
            elif type == "array" then
              reduce .[] as $secret ({};
                if ($secret | type) != "object" then
                  error("Infisical JSON array contains a non-object entry")
                elif ($secret.key? | type) == "string" then
                  .[$app + "_" + ($secret.key | ascii_downcase)] = $secret.value
                elif ($secret.secretKey? | type) == "string" then
                  .[$app + "_" + ($secret.secretKey | ascii_downcase)] = $secret.secretValue
                else
                  error("Infisical JSON entry does not contain a supported secret key field")
                end
              )
            else
              error("Infisical JSON export must be an object or array")
            end
          ' "${app_json}" > "${vars_json}"

          jq --arg token "${cloudflare_token}" \
            '. + {cloudflare_api_token: $token}' \
            "${vars_json}" > "${vars_json}.tmp"
          mv "${vars_json}.tmp" "${vars_json}"

          # Registry credentials, when this identity may read them: the target
          # logs in before pulling private images (new-generation hosts have
          # no standing registry login).
          registry_user=""
          registry_token=""
          if [[ -n "${{ inputs.infisical-registry-project-id }}" ]]; then
            registry_user="$(infisical secrets get DO_REGISTRY_USERNAME \
              --projectId="${{ inputs.infisical-registry-project-id }}" \
              --env=prod --path=/docker-registry --plain --silent 2>/dev/null || true)"
            registry_token="$(infisical secrets get DO_REGISTRY_ACCESS_TOKEN \
              --projectId="${{ inputs.infisical-registry-project-id }}" \
              --env=prod --path=/docker-registry --plain --silent 2>/dev/null || true)"
          fi
          if [[ -n "${registry_user}" && -n "${registry_token}" ]]; then
            echo "::add-mask::${registry_token}"
            jq --arg user "${registry_user}" --arg token "${registry_token}" \
              '. + {docker_registry_user: $user, docker_registry_token: $token}' \
              "${vars_json}" > "${vars_json}.tmp"
            mv "${vars_json}.tmp" "${vars_json}"
          else
            echo "No container-registry credentials for this identity; the target will not log in."
          fi

          printf '%s' "${EXTRA_VARS_JSON}" > "${extra_json}"
          jq -e 'type == "object"' "${extra_json}" >/dev/null
          jq -s '.[0] * .[1]' "${vars_json}" "${extra_json}" > "${vars_json}.tmp"
          mv "${vars_json}.tmp" "${vars_json}"

          chmod 0600 "${vars_json}"
          echo "path=${vars_json}" >> "$GITHUB_OUTPUT"

      - name: Install Ansible
        run: python -m pip install --disable-pip-version-check ansible

      - name: Install Ansible collections
        working-directory: adb-deploy
        run: ansible-galaxy collection install -r requirements.yml

      - name: Deploy application and infrastructure
        working-directory: adb-deploy
        shell: bash
        env:
          IAC_INVENTORY_DIR: ${{ steps.iac.outputs.dir }}
        run: |
          set -euo pipefail
          inventories=()
          if [[ -n "${IAC_INVENTORY_DIR}" ]]; then
            inventories=(-i inventories/production/hosts.ini -i "${IAC_INVENTORY_DIR}/iac_hosts.yml")
          fi
          ansible-playbook "${inventories[@]}" deploy_application.yml \
            --extra-vars "application_name=${{ inputs.application }}" \
            --extra-vars '{"application_migrate": ${{ inputs.migrate }}}' \
            --extra-vars "deployment_image_tag=${{ inputs.image-tag }}" \
            --extra-vars "@${{ steps.ansible-vars.outputs.path }}"

      - name: Remove temporary deployment material
        if: always()
        run: |
          rm -f "${{ steps.ansible-vars.outputs.path }}"
          rm -f ~/.ssh/id_ed25519 ~/.ssh/id_legacy ~/.ssh/config
          rm -rf "${RUNNER_TEMP}/adb-migration"
          rm -rf "${RUNNER_TEMP}/iac-inventory"
