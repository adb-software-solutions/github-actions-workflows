name: Reusable Application Deploy

on:
  workflow_call:
    inputs:
      application:
        type: string
        required: true
      image-tag:
        type: string
        default: latest
      infisical-identity-id:
        type: string
        required: true
      infisical-application-project-id:
        type: string
        required: true
      infisical-deployment-bootstrap-project-id:
        type: string
        required: true
      infisical-infrastructure-project-id:
        type: string
        required: true
      infisical-api-url:
        type: string
        default: https://secrets.adbsoftwaresolutions.co.uk
      ssh-host:
        type: string
        default: 206.189.28.66
      ssh-port:
        type: number
        default: 1999

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.application }}
    runs-on: ubuntu-latest
    concurrency:
      group: adb-deploy-${{ inputs.application }}
      cancel-in-progress: false
    steps:
      - name: Validate deployment request
        shell: bash
        env:
          APPLICATION: ${{ inputs.application }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/deploy" ]]; then
            echo "This reusable deployment workflow may only run from the deploy branch." >&2
            exit 1
          fi

          if [[ ! "${APPLICATION}" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Application names must contain only lowercase letters, numbers, and hyphens." >&2
            exit 1
          fi

          if [[ ! "${IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Image tag is not a valid Docker tag." >&2
            exit 1
          fi

      - name: Install Infisical CLI
        run: npm install --global @infisical/cli

      - name: Authenticate to Infisical
        shell: bash
        env:
          INFISICAL_API_URL: ${{ inputs.infisical-api-url }}
        run: |
          set -euo pipefail
          oidc_token="$(curl -fsS -G \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=https://github.com/adb-software-solutions" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')"
          access_token="$(curl -fsS -X POST \
            "${INFISICAL_API_URL}/api/v1/auth/oidc-auth/login" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "identityId=${{ inputs.infisical-identity-id }}" \
            --data-urlencode "jwt=${oidc_token}" | jq -r '.accessToken')"
          test -n "${access_token}" && test "${access_token}" != "null"
          echo "::add-mask::${access_token}"
          {
            echo "INFISICAL_API_URL=${INFISICAL_API_URL}"
            echo "INFISICAL_TOKEN=${access_token}"
            echo "INFISICAL_DISABLE_UPDATE_CHECK=true"
          } >> "$GITHUB_ENV"

      - name: Read deployment bootstrap credentials
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          repo_pat="$(infisical secrets get DEPLOY_REPO_PAT \
            --projectId="${{ inputs.infisical-deployment-bootstrap-project-id }}" \
            --env=prod --path=/github --plain --silent)"
          ssh_key_base64="$(infisical secrets get DEPLOY_SSH_KEY \
            --projectId="${{ inputs.infisical-deployment-bootstrap-project-id }}" \
            --env=prod --path=/ssh --plain --silent | base64 -w 0)"
          test -n "${repo_pat}"
          test -n "${ssh_key_base64}"
          echo "::add-mask::${repo_pat}"
          echo "::add-mask::${ssh_key_base64}"
          {
            echo "repo-pat=${repo_pat}"
            echo "ssh-key-base64=${ssh_key_base64}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout deployment repository
        uses: actions/checkout@v7
        with:
          repository: adb-software-solutions/adb-deploy
          ref: main
          token: ${{ steps.bootstrap.outputs.repo-pat }}
          path: adb-deploy

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY_BASE64: ${{ steps.bootstrap.outputs.ssh-key-base64 }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s' "${DEPLOY_SSH_KEY_BASE64}" | base64 --decode > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ inputs.ssh-port }}" "${{ inputs.ssh-host }}" >> ~/.ssh/known_hosts

      - name: Build Ansible variables from Infisical
        id: ansible-vars
        shell: bash
        env:
          APPLICATION: ${{ inputs.application }}
        run: |
          set -euo pipefail
          app_json="${RUNNER_TEMP}/application-secrets.json"
          vars_json="${RUNNER_TEMP}/ansible-extra-vars.json"
          trap 'rm -f "${app_json}"' EXIT

          infisical export \
            --projectId="${{ inputs.infisical-application-project-id }}" \
            --env=prod --path=/ --format=json \
            --output-file="${app_json}" >/dev/null

          cloudflare_token="$(infisical secrets get CLOUDFLARE_API_TOKEN \
            --projectId="${{ inputs.infisical-infrastructure-project-id }}" \
            --env=prod --path=/cloudflare --plain --silent)"
          test -n "${cloudflare_token}"
          echo "::add-mask::${cloudflare_token}"

          jq --arg app "${APPLICATION}" '
            if type == "object" then
              with_entries(
                if (.key | type) != "string" then
                  error("Infisical JSON object contains a non-string secret key")
                else
                  .key = ($app + "_" + (.key | ascii_downcase))
                end
              )
            elif type == "array" then
              reduce .[] as $secret ({};
                if ($secret | type) != "object" then
                  error("Infisical JSON array contains a non-object entry")
                elif ($secret.key? | type) == "string" then
                  .[$app + "_" + ($secret.key | ascii_downcase)] = $secret.value
                elif ($secret.secretKey? | type) == "string" then
                  .[$app + "_" + ($secret.secretKey | ascii_downcase)] = $secret.secretValue
                else
                  error("Infisical JSON entry does not contain a supported secret key field")
                end
              )
            else
              error("Infisical JSON export must be an object or array")
            end
          ' "${app_json}" > "${vars_json}"

          jq --arg token "${cloudflare_token}" \
            '. + {cloudflare_api_token: $token}' \
            "${vars_json}" > "${vars_json}.tmp"
          mv "${vars_json}.tmp" "${vars_json}"
          chmod 0600 "${vars_json}"
          echo "path=${vars_json}" >> "$GITHUB_OUTPUT"

      - name: Install Ansible
        run: python -m pip install --disable-pip-version-check ansible

      - name: Install Ansible collections
        working-directory: adb-deploy
        run: ansible-galaxy collection install -r requirements.yml

      - name: Deploy application and infrastructure
        working-directory: adb-deploy
        shell: bash
        run: |
          set -euo pipefail
          ansible-playbook deploy_application.yml \
            --extra-vars "application_name=${{ inputs.application }}" \
            --extra-vars "deployment_image_tag=${{ inputs.image-tag }}" \
            --extra-vars "@${{ steps.ansible-vars.outputs.path }}"

      - name: Remove temporary deployment material
        if: always()
        run: |
          rm -f "${{ steps.ansible-vars.outputs.path }}"
          rm -f ~/.ssh/id_ed25519
