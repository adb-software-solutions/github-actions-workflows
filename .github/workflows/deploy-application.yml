name: Reusable Application Deploy

on:
  workflow_call:
    inputs:
      application:
        type: string
        required: true
      image-tag:
        description: >-
          Image tag to deploy. Empty (the default) builds build-images from this
          commit and deploys its SHA, or deploys latest when build-images is
          empty. A full Git SHA redeploys or rolls back to that image.
        type: string
        default: ""
      build-images:
        description: >-
          JSON array of images to build from this commit before deploying,
          built only when image-tag is empty. Each entry is an image suffix
          ("website") or an object {"image": ..., plus any of "context",
          "build-env-file", "build-env-keys", "optional-build-env-keys",
          "build-arg-keys", "optional-build-arg-keys"}; the matching inputs
          below are the defaults.
        type: string
        default: "[]"
      build-context:
        type: string
        default: .
      registry:
        type: string
        default: registry.digitalocean.com/adbsoftwaresolutions
      infisical-registry-project-id:
        description: Infisical project with the /docker-registry credentials (required to build).
        type: string
        default: ""
      build-arg-keys:
        type: string
        default: "[]"
      optional-build-arg-keys:
        type: string
        default: "[]"
      build-env-file:
        type: string
        default: ""
      build-env-keys:
        type: string
        default: "[]"
      optional-build-env-keys:
        type: string
        default: "[]"
      ansible-extra-vars-json:
        type: string
        default: "{}"
      infisical-identity-id:
        type: string
        required: true
      infisical-application-project-id:
        type: string
        required: true
      infisical-deployment-bootstrap-project-id:
        type: string
        required: true
      infisical-infrastructure-project-id:
        type: string
        required: true
      infisical-api-url:
        type: string
        default: https://secrets.adbsoftwaresolutions.co.uk

permissions:
  contents: read
  id-token: write

jobs:
  # Decide what this run deploys: a tag given by the caller (redeploy or
  # rollback), else the images built from this commit, else latest (callers
  # that do not build here yet).
  plan:
    name: Plan ${{ inputs.application }}
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      images: ${{ steps.plan.outputs.images }}
      image-tag: ${{ steps.plan.outputs.image-tag }}
    steps:
      - name: Choose the image tag
        id: plan
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          BUILD_IMAGES: ${{ inputs.build-images }}
          REGISTRY_PROJECT: ${{ inputs.infisical-registry-project-id }}
          DEFAULTS: >-
            {"context": ${{ toJSON(inputs.build-context) }},
             "build-env-file": ${{ toJSON(inputs.build-env-file) }},
             "build-env-keys": ${{ toJSON(inputs.build-env-keys) }},
             "optional-build-env-keys": ${{ toJSON(inputs.optional-build-env-keys) }},
             "build-arg-keys": ${{ toJSON(inputs.build-arg-keys) }},
             "optional-build-arg-keys": ${{ toJSON(inputs.optional-build-arg-keys) }}}
        run: |
          set -euo pipefail
          # Every entry becomes a complete object; key lists stay JSON strings,
          # as the build action expects.
          images="$(jq -c --argjson defaults "${DEFAULTS}" '
            map(if type == "string" then {image: .} else . end
                | $defaults + (with_entries(
                    if (.value | type) == "array" then .value |= tojson else . end)))
            ' <<< "${BUILD_IMAGES}")"
          jq -e 'all(.[]; (.image | type) == "string" and (.image | test("^[a-z0-9][a-z0-9-]*$")))' \
            <<< "${images}" >/dev/null || { echo "Every build image needs a valid image name." >&2; exit 1; }
          count="$(jq 'length' <<< "${images}")"
          if [[ -n "${IMAGE_TAG}" ]]; then
            build=false tag="${IMAGE_TAG}"
          elif [[ "${count}" -gt 0 ]]; then
            if [[ -z "${REGISTRY_PROJECT}" ]]; then
              echo "build-images needs infisical-registry-project-id." >&2
              exit 1
            fi
            build=true tag="${GITHUB_SHA}"
          else
            build=false tag=latest
          fi
          {
            echo "build=${build}"
            echo "images=${images}"
            echo "image-tag=${tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying ${tag} (build here: ${build})" >> "$GITHUB_STEP_SUMMARY"

  # Images are built here, with the deploy identity (its OIDC binding allows
  # only this workflow on the deploy branch), so the deployed image is exactly
  # this commit.
  build:
    name: Build ${{ matrix.build.image }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        build: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - name: Check the branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/heads/deploy ]]; then
            echo "Images are only built for deployment from refs/heads/deploy." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Infisical CLI
        run: npm install --global @infisical/cli

      - name: Authenticate to Infisical
        shell: bash
        env:
          INFISICAL_API_URL: ${{ inputs.infisical-api-url }}
        run: |
          set -euo pipefail
          oidc_token="$(curl -fsS -G \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=https://github.com/adb-software-solutions" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')"
          access_token="$(curl -fsS -X POST \
            "${INFISICAL_API_URL}/api/v1/auth/oidc-auth/login" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "identityId=${{ inputs.infisical-identity-id }}" \
            --data-urlencode "jwt=${oidc_token}" | jq -r '.accessToken')"
          test -n "${access_token}" && test "${access_token}" != "null"
          echo "::add-mask::${access_token}"
          {
            echo "INFISICAL_API_URL=${INFISICAL_API_URL}"
            echo "INFISICAL_TOKEN=${access_token}"
            echo "INFISICAL_DISABLE_UPDATE_CHECK=true"
          } >> "$GITHUB_ENV"

      - name: Build, push and scan
        uses: adb-software-solutions/github-actions-workflows/.github/actions/docker-build-push@v1
        with:
          application: ${{ inputs.application }}
          image: ${{ matrix.build.image }}
          context: ${{ matrix.build.context }}
          registry: ${{ inputs.registry }}
          tag: ${{ needs.plan.outputs.image-tag }}
          infisical-registry-project-id: ${{ inputs.infisical-registry-project-id }}
          infisical-application-project-id: ${{ inputs.infisical-application-project-id }}
          build-arg-keys: ${{ matrix.build['build-arg-keys'] }}
          optional-build-arg-keys: ${{ matrix.build['optional-build-arg-keys'] }}
          build-env-file: ${{ matrix.build['build-env-file'] }}
          build-env-keys: ${{ matrix.build['build-env-keys'] }}
          optional-build-env-keys: ${{ matrix.build['optional-build-env-keys'] }}

  deploy:
    name: Deploy ${{ inputs.application }}
    needs: [plan, build]
    # Runs when the build succeeded or was not needed; never after a failed build.
    if: >-
      always() && needs.plan.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: adb-deploy-${{ inputs.application }}
      cancel-in-progress: false
    steps:
      - name: Validate deployment request
        shell: bash
        env:
          APPLICATION: ${{ inputs.application }}
          IMAGE_TAG: ${{ needs.plan.outputs.image-tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REPOSITORY}" == "adb-software-solutions/external-app-deployments" ]]; then
            expected_ref="refs/heads/main"
          else
            expected_ref="refs/heads/deploy"
          fi

          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "This reusable deployment workflow may only run from ${expected_ref}." >&2
            exit 1
          fi

          if [[ ! "${APPLICATION}" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Application names must contain only lowercase letters, numbers, and hyphens." >&2
            exit 1
          fi

          if [[ ! "${IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Image tag is not a valid Docker tag." >&2
            exit 1
          fi

      - name: Install Infisical CLI
        run: npm install --global @infisical/cli

      - name: Authenticate to Infisical
        shell: bash
        env:
          INFISICAL_API_URL: ${{ inputs.infisical-api-url }}
        run: |
          set -euo pipefail
          oidc_token="$(curl -fsS -G \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=https://github.com/adb-software-solutions" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')"
          access_token="$(curl -fsS -X POST \
            "${INFISICAL_API_URL}/api/v1/auth/oidc-auth/login" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "identityId=${{ inputs.infisical-identity-id }}" \
            --data-urlencode "jwt=${oidc_token}" | jq -r '.accessToken')"
          test -n "${access_token}" && test "${access_token}" != "null"
          echo "::add-mask::${access_token}"
          {
            echo "INFISICAL_API_URL=${INFISICAL_API_URL}"
            echo "INFISICAL_TOKEN=${access_token}"
            echo "INFISICAL_DISABLE_UPDATE_CHECK=true"
          } >> "$GITHUB_ENV"

      - name: Read deployment bootstrap credentials
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          repo_pat="$(infisical secrets get DEPLOY_REPO_PAT \
            --projectId="${{ inputs.infisical-deployment-bootstrap-project-id }}" \
            --env=prod --path=/github --plain --silent)"
          test -n "${repo_pat}"
          echo "::add-mask::${repo_pat}"
          echo "repo-pat=${repo_pat}" >> "$GITHUB_OUTPUT"

      - name: Checkout deployment repository
        uses: actions/checkout@v7
        with:
          repository: adb-software-solutions/adb-deploy
          ref: main
          token: ${{ steps.bootstrap.outputs.repo-pat }}
          path: adb-deploy

      # Every host is a new-generation (adb-iac) deploy target from the
      # published deploy inventory; the legacy (port 1999) hosts are retired.
      - name: Resolve deployment target
        id: target
        shell: bash
        env:
          APPLICATION: ${{ inputs.application }}
          EXTRA_VARS_JSON: ${{ inputs.ansible-extra-vars-json }}
        run: |
          set -euo pipefail
          definition="adb-deploy/vars/applications/${APPLICATION}.yml"
          test -f "${definition}"
          host="$(printf '%s' "${EXTRA_VARS_JSON}" | jq -r '.application_host_override // empty')"
          if [[ -z "${host}" ]]; then
            host="$(yq -r '.application.host' "${definition}")"
          fi
          if [[ ! "${host}" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Application host '${host}' is not a valid inventory name." >&2
            exit 1
          fi
          echo "Deploying to ${host}."
          echo "host=${host}" >> "$GITHUB_OUTPUT"

      - name: Load the adb-iac deploy inventory
        id: iac
        shell: bash
        env:
          BOOTSTRAP_PROJECT: ${{ inputs.infisical-deployment-bootstrap-project-id }}
          HOST: ${{ steps.target.outputs.host }}
        run: |
          set -euo pipefail
          read_secret() {
            infisical secrets get "$2" --projectId="${BOOTSTRAP_PROJECT}" \
              --env=prod --path="$1" --plain --silent
          }
          IAC_INVENTORY_ACCESS_KEY_ID="$(read_secret /r2 IAC_INVENTORY_ACCESS_KEY_ID)"
          IAC_INVENTORY_SECRET_ACCESS_KEY="$(read_secret /r2 IAC_INVENTORY_SECRET_ACCESS_KEY)"
          echo "::add-mask::${IAC_INVENTORY_SECRET_ACCESS_KEY}"
          IAC_INVENTORY_ENDPOINT="$(read_secret /r2 IAC_INVENTORY_ENDPOINT)"
          IAC_INVENTORY_BUCKET="$(read_secret /r2 IAC_INVENTORY_BUCKET)"
          export IAC_INVENTORY_ACCESS_KEY_ID IAC_INVENTORY_SECRET_ACCESS_KEY IAC_INVENTORY_ENDPOINT IAC_INVENTORY_BUCKET

          dir="${RUNNER_TEMP}/iac-inventory"
          adb-deploy/scripts/fetch-iac-inventory.sh "${dir}"
          inventory="${dir}/inventory.json"
          if ! jq -e --arg h "${HOST}" '.hosts[$h]' "${inventory}" >/dev/null; then
            reason="$(jq -r --arg h "${HOST}" '.pending[$h] // "not in the adb-iac deploy inventory"' "${inventory}")"
            echo "${HOST} is not deployable: ${reason}" >&2
            exit 1
          fi
          pool="$(jq -r --arg h "${HOST}" '.hosts[$h].pool' "${inventory}")"
          jq -e --arg p "${pool}" '.pools[$p].tailscale_client_id' "${inventory}" >/dev/null
          {
            echo "dir=${dir}"
            echo "pool=${pool}"
            echo "secret=IAC_DEPLOY_SSH_KEY_$(tr 'a-z-' 'A-Z_' <<<"${pool}")"
            jq -r --arg p "${pool}" '.pools[$p] |
              "client-id=\(.tailscale_client_id)", "audience=\(.tailscale_audience)", "tag=\(.runner_tag)"' "${inventory}"
          } >> "$GITHUB_OUTPUT"

      # The pool's trust credential only issues this tag to the callers it is
      # bound to, and the tag only reaches that pool's hosts on SSH.
      - name: Join the tailnet as the pool's deploy runner
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ steps.iac.outputs.client-id }}
          audience: ${{ steps.iac.outputs.audience }}
          tags: ${{ steps.iac.outputs.tag }}
          hostname: gha-deploy-${{ inputs.application }}-${{ github.run_id }}-${{ github.run_attempt }}
          # The action always passes --accept-routes; repeating it makes
          # `tailscale up` fail. Routes are turned off in the next step.
          args: --accept-dns=true

      - name: Configure SSH (adb-iac)
        shell: bash
        env:
          BOOTSTRAP_PROJECT: ${{ inputs.infisical-deployment-bootstrap-project-id }}
          SECRET: ${{ steps.iac.outputs.secret }}
        run: |
          set -euo pipefail
          sudo tailscale set --accept-routes=false
          install -d -m 0700 ~/.ssh
          umask 077
          infisical secrets get "${SECRET}" --projectId="${BOOTSTRAP_PROJECT}" \
            --env=prod --path=/ssh --plain --silent > ~/.ssh/id_ed25519
          test -s ~/.ssh/id_ed25519
          # Host keys come only from the published inventory (strict checking).

      - name: Build Ansible variables from Infisical
        id: ansible-vars
        shell: bash
        env:
          APPLICATION: ${{ inputs.application }}
          EXTRA_VARS_JSON: ${{ inputs.ansible-extra-vars-json }}
        run: |
          set -euo pipefail
          app_json="${RUNNER_TEMP}/application-secrets.json"
          extra_json="${RUNNER_TEMP}/deployment-extra-vars.json"
          vars_json="${RUNNER_TEMP}/ansible-extra-vars.json"
          trap 'rm -f "${app_json}" "${extra_json}"' EXIT

          infisical export \
            --projectId="${{ inputs.infisical-application-project-id }}" \
            --env=prod --path=/ --format=json \
            --output-file="${app_json}" >/dev/null

          cloudflare_token="$(infisical secrets get CLOUDFLARE_API_TOKEN \
            --projectId="${{ inputs.infisical-infrastructure-project-id }}" \
            --env=prod --path=/cloudflare --plain --silent)"
          test -n "${cloudflare_token}"
          echo "::add-mask::${cloudflare_token}"

          # R2 credentials for application backups (adb-deploy
          # configure_backups). Read when present: adb-deploy refuses to
          # deploy an application that has data to back up without them.
          read_backup_secret() {
            infisical secrets get "$1" \
              --projectId="${{ inputs.infisical-infrastructure-project-id }}" \
              --env=prod --path=/cloudflare --plain --silent 2>/dev/null || true
          }
          backup_key_id="$(read_backup_secret R2_APP_BACKUP_ACCESS_KEY_ID)"
          backup_secret="$(read_backup_secret R2_APP_BACKUP_SECRET_ACCESS_KEY)"
          [[ -z "${backup_key_id}" ]] || echo "::add-mask::${backup_key_id}"
          [[ -z "${backup_secret}" ]] || echo "::add-mask::${backup_secret}"

          # Variables are <application>_<key>; hyphens become underscores so
          # every name is a valid Jinja identifier (adb-web-platform ->
          # adb_web_platform_secret_key).
          jq --arg app "${APPLICATION//-/_}" '
            if type == "object" then
              with_entries(
                if (.key | type) != "string" then
                  error("Infisical JSON object contains a non-string secret key")
                else
                  .key = ($app + "_" + (.key | ascii_downcase))
                end
              )
            elif type == "array" then
              reduce .[] as $secret ({};
                if ($secret | type) != "object" then
                  error("Infisical JSON array contains a non-object entry")
                elif ($secret.key? | type) == "string" then
                  .[$app + "_" + ($secret.key | ascii_downcase)] = $secret.value
                elif ($secret.secretKey? | type) == "string" then
                  .[$app + "_" + ($secret.secretKey | ascii_downcase)] = $secret.secretValue
                else
                  error("Infisical JSON entry does not contain a supported secret key field")
                end
              )
            else
              error("Infisical JSON export must be an object or array")
            end
          ' "${app_json}" > "${vars_json}"

          jq --arg token "${cloudflare_token}" \
            --arg backup_key_id "${backup_key_id}" \
            --arg backup_secret "${backup_secret}" \
            '. + {cloudflare_api_token: $token}
              + if $backup_key_id != "" and $backup_secret != "" then
                  {app_backup_r2_access_key_id: $backup_key_id,
                   app_backup_r2_secret_access_key: $backup_secret}
                else {} end' \
            "${vars_json}" > "${vars_json}.tmp"
          mv "${vars_json}.tmp" "${vars_json}"

          printf '%s' "${EXTRA_VARS_JSON}" > "${extra_json}"
          jq -e 'type == "object"' "${extra_json}" >/dev/null
          jq -s '.[0] * .[1]' "${vars_json}" "${extra_json}" > "${vars_json}.tmp"
          mv "${vars_json}.tmp" "${vars_json}"

          chmod 0600 "${vars_json}"
          echo "path=${vars_json}" >> "$GITHUB_OUTPUT"

      - name: Install Ansible
        run: python -m pip install --disable-pip-version-check ansible

      - name: Install Ansible collections
        working-directory: adb-deploy
        run: ansible-galaxy collection install -r requirements.yml

      - name: Deploy application and infrastructure
        working-directory: adb-deploy
        shell: bash
        env:
          IAC_INVENTORY_DIR: ${{ steps.iac.outputs.dir }}
        run: |
          set -euo pipefail
          ansible-playbook -i "${IAC_INVENTORY_DIR}/iac_hosts.yml" deploy_application.yml \
            --extra-vars "application_name=${{ inputs.application }}" \
            --extra-vars "deployment_image_tag=${{ needs.plan.outputs.image-tag }}" \
            --extra-vars "@${{ steps.ansible-vars.outputs.path }}"

      - name: Remove temporary deployment material
        if: always()
        run: |
          rm -f "${{ steps.ansible-vars.outputs.path }}"
          rm -f ~/.ssh/id_ed25519
          rm -rf "${RUNNER_TEMP}/adb-migration"
          rm -rf "${RUNNER_TEMP}/iac-inventory"
