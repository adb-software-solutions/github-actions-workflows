name: Docker Build and Push
description: >-
  Build one application image from Dockerfile.<image>, push it to the
  registry tagged with the commit SHA (and latest), and scan it with Trivy.
  Expects INFISICAL_TOKEN and INFISICAL_API_URL in the environment (an
  earlier Infisical login step) and the repository checked out.

inputs:
  application:
    description: Application name; images are <registry>/<application>-<image>.
    required: true
  image:
    description: Image suffix; built from Dockerfile.<image>.
    required: true
  context:
    description: Docker build context.
    default: .
  registry:
    description: Container registry.
    default: registry.digitalocean.com/adbsoftwaresolutions
  tag:
    description: Immutable tag, normally the commit SHA being built.
    required: true
  infisical-registry-project-id:
    description: Infisical project holding /docker-registry credentials.
    required: true
  infisical-application-project-id:
    description: Infisical project holding the application's build values.
    default: ""
  build-arg-keys:
    description: JSON array of required non-sensitive application values passed as Docker build args.
    default: "[]"
  optional-build-arg-keys:
    description: JSON array of optional non-sensitive application values passed as Docker build args when present.
    default: "[]"
  build-env-file:
    description: Optional dotenv file for non-sensitive build-time configuration.
    default: ""
  build-env-keys:
    description: JSON array of required non-sensitive application values written to build-env-file.
    default: "[]"
  optional-build-env-keys:
    description: JSON array of optional non-sensitive application values written to build-env-file when present.
    default: "[]"

runs:
  using: composite
  steps:
    - name: Log in to DigitalOcean Container Registry
      shell: bash
      env:
        REGISTRY_PROJECT: ${{ inputs.infisical-registry-project-id }}
      run: |
        set -euo pipefail
        username="$(infisical secrets get DO_REGISTRY_USERNAME \
          --projectId="${REGISTRY_PROJECT}" \
          --env=prod --path=/docker-registry --plain --silent)"
        token="$(infisical secrets get DO_REGISTRY_ACCESS_TOKEN \
          --projectId="${REGISTRY_PROJECT}" \
          --env=prod --path=/docker-registry --plain --silent)"
        test -n "${username}"
        test -n "${token}"
        echo "::add-mask::${token}"
        printf '%s' "${token}" | docker login \
          --username "${username}" --password-stdin registry.digitalocean.com

    - name: Prepare application build values
      id: build-values
      if: inputs.infisical-application-project-id != ''
      shell: bash
      env:
        APPLICATION_PROJECT: ${{ inputs.infisical-application-project-id }}
        IMAGE: ${{ inputs.image }}
        BUILD_ARG_KEYS: ${{ inputs.build-arg-keys }}
        OPTIONAL_BUILD_ARG_KEYS: ${{ inputs.optional-build-arg-keys }}
        BUILD_ENV_KEYS: ${{ inputs.build-env-keys }}
        OPTIONAL_BUILD_ENV_KEYS: ${{ inputs.optional-build-env-keys }}
        BUILD_ENV_FILE: ${{ inputs.build-env-file }}
      run: |
        set -euo pipefail
        args_file="${RUNNER_TEMP}/docker-build-args-${IMAGE}"
        : > "${args_file}"

        while IFS= read -r key; do
          [[ -z "${key}" ]] && continue
          value="$(infisical secrets get "${key}" \
            --projectId="${APPLICATION_PROJECT}" \
            --env=prod --path=/ --plain --silent)"
          test -n "${value}"
          echo "::add-mask::${value}"
          printf '%s\0%s\0' "--build-arg" "${key}=${value}" >> "${args_file}"
        done < <(jq -r '.[]' <<< "${BUILD_ARG_KEYS}")

        while IFS= read -r key; do
          [[ -z "${key}" ]] && continue
          value=""
          if value="$(infisical secrets get "${key}" \
            --projectId="${APPLICATION_PROJECT}" \
            --env=prod --path=/ --plain --silent 2>/dev/null)" && [[ -n "${value}" ]]; then
            echo "::add-mask::${value}"
            printf '%s\0%s\0' "--build-arg" "${key}=${value}" >> "${args_file}"
          fi
        done < <(jq -r '.[]' <<< "${OPTIONAL_BUILD_ARG_KEYS}")

        if [[ -n "${BUILD_ENV_FILE}" ]]; then
          mkdir -p "$(dirname "${BUILD_ENV_FILE}")"
          umask 077
          : > "${BUILD_ENV_FILE}"
          while IFS= read -r key; do
            [[ -z "${key}" ]] && continue
            value="$(infisical secrets get "${key}" \
              --projectId="${APPLICATION_PROJECT}" \
              --env=prod --path=/ --plain --silent)"
            test -n "${value}"
            echo "::add-mask::${value}"
            printf '%s=%s\n' "${key}" "${value}" >> "${BUILD_ENV_FILE}"
          done < <(jq -r '.[]' <<< "${BUILD_ENV_KEYS}")

          while IFS= read -r key; do
            [[ -z "${key}" ]] && continue
            value=""
            if value="$(infisical secrets get "${key}" \
              --projectId="${APPLICATION_PROJECT}" \
              --env=prod --path=/ --plain --silent 2>/dev/null)" && [[ -n "${value}" ]]; then
              echo "::add-mask::${value}"
              printf '%s=%s\n' "${key}" "${value}" >> "${BUILD_ENV_FILE}"
            fi
          done < <(jq -r '.[]' <<< "${OPTIONAL_BUILD_ENV_KEYS}")
        fi

        echo "args-file=${args_file}" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      shell: bash
      env:
        IMAGE_REPOSITORY: ${{ inputs.registry }}/${{ inputs.application }}-${{ inputs.image }}
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        CONTEXT: ${{ inputs.context }}
        ARGS_FILE: ${{ steps.build-values.outputs.args-file }}
      run: |
        set -euo pipefail
        latest_image="${IMAGE_REPOSITORY}:latest"
        tagged_image="${IMAGE_REPOSITORY}:${TAG}"
        build_args=()
        if [[ -n "${ARGS_FILE}" && -f "${ARGS_FILE}" ]]; then
          while IFS= read -r -d '' item; do
            build_args+=("${item}")
          done < "${ARGS_FILE}"
        fi

        docker build \
          -f "Dockerfile.${IMAGE}" \
          -t "${latest_image}" \
          -t "${tagged_image}" \
          "${build_args[@]}" \
          "${CONTEXT}"

        docker push "${tagged_image}"
        docker push "${latest_image}"

        {
          echo "### Docker image published"
          echo
          echo "- Image: \`${IMAGE_REPOSITORY}\`"
          echo "- Immutable tag: \`${TAG}\`"
          echo "- Moving tag: \`latest\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Remove temporary build files
      if: always()
      shell: bash
      env:
        BUILD_ENV_FILE: ${{ inputs.build-env-file }}
        ARGS_FILE: ${{ steps.build-values.outputs.args-file }}
      run: |
        [[ -z "${BUILD_ENV_FILE}" ]] || rm -f "${BUILD_ENV_FILE}"
        [[ -z "${ARGS_FILE}" ]] || rm -f "${ARGS_FILE}"

    - name: Trivy image scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: image
        image-ref: ${{ inputs.registry }}/${{ inputs.application }}-${{ inputs.image }}:${{ inputs.tag }}
        severity: HIGH,CRITICAL
        output: trivy-${{ inputs.image }}-scan.txt

    - name: Upload Trivy scan
      uses: actions/upload-artifact@v6
      with:
        name: trivy-image-scan-${{ inputs.image }}
        path: trivy-${{ inputs.image }}-scan.txt
